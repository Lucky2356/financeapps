name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Verify app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Уязвимость в зависимости — такой же дефект, как упавший тест, и ловить
      # её нужно здесь. В 1.24.0 три исправления безопасности уехали обратно
      # вместе с откатом лок-файла, и заметить это было нечем: сборка была
      # зелёной. Проверяется только то, что доезжает до сборки и до людей;
      # инструменты разработки (--omit=dev) на устройство не попадают.
      - name: Проверка зависимостей на уязвимости
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests + coverage thresholds
        run: npm run test:coverage

      - name: Build static shell
        run: npm run build:static

  e2e:
    name: E2E (static shell)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static shell
        run: npm run build:static

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
