name: Desktop Seams

# Швы собранного приложения — то, чего не достаёт ни одна другая проверка.
#
# В памятке выпуска про них написано прямо: «четыре вещи уезжают непроверенными
# — файловый плагин, родные окна, обновлялка и политика безопасности в том виде,
# как её применяет WebView2. Поломка в любой выглядит ровно как зелёная сборка».
# Три из четырёх закрываются здесь; четвёртая, родные окна выбора файла,
# остаётся ручной, и это записано в самой проверке.
#
# Почему отдельным действием, а не шагом выпуска. Пока не доказано, что прогон
# держится сам, ставить его на дорогу выпуска нельзя: сорвавшаяся проверка
# останавливала бы выпуск, ничего не говоря о приложении. Как отстоится — станет
# шагом desktop-release.yml перед публикацией, и там ему самое место: сборка там
# уже есть, платить за неё второй раз не придётся.

on:
  workflow_dispatch:
  schedule:
    # Раз в неделю, ночью с воскресенья на понедельник по Москве.
    - cron: "0 22 * * 0"

permissions:
  contents: read

jobs:
  seams:
    name: Drive the built app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            src-tauri/target
          key: seams-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: seams-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Build static desktop shell
        run: npm run build:static

      # Сборка без подписи: подпись проверяет выпуск, здесь речь о поведении.
      - name: Build Tauri Windows bundle
        run: npx tauri build --no-bundle

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # tauri-driver разговаривает с WebView2 через драйвер Edge, и драйвер
      # обязан совпадать с ВЕРСИЕЙ WEBVIEW2, а не с версией браузера Edge.
      #
      # На машине сборки стоит и то и другое, и версии у них разные. Драйвер с
      # машины (переменная EDGEWEBDRIVER) собран под браузер — с WebView2 он
      # здоровается и не договаривается, а наружу это выходит одной строкой:
      #
      #     session not created: DevToolsActivePort file doesn't exist
      #
      # Строка эта не про порт и не про файл: так выглядит «приложение не
      # поднялось, и драйвер не дождался». Первый прогон упал ровно на ней.
      #
      # Поэтому версия WebView2 читается из реестра, и драйвер берётся ровно
      # под неё.
      - name: Match Edge WebDriver to the WebView2 runtime
        shell: pwsh
        run: |
          $client = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty -Path $client -ErrorAction Stop).pv
          Write-Host "WebView2: $version"
          $into = Join-Path $env:RUNNER_TEMP 'edgedriver'
          $zip = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $into -Force
          & (Join-Path $into 'msedgedriver.exe') --version
          Add-Content -Path $env:GITHUB_PATH -Value $into

      - name: Drive the built app
        shell: pwsh
        run: node scripts/drive-desktop.mjs
