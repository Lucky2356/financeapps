name: Windows Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для публикации релиза, напр. v1.0.1. Пусто = только собрать артефакт без публикации."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    # The Android job publishes into the release this job creates, so it takes
    # the tag from here rather than resolving it a second time and risking a
    # different answer.
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      publish: ${{ steps.rel.outputs.publish }}

    env:
      # True only when an updater signing key secret is configured. Gates the
      # signed-build + manifest path so the workflow still produces a plain
      # installer before keys are set up. Accepts either the standard
      # TAURI_SIGNING_PRIVATE_KEY or the AUTO_UPDATE secret name.
      HAS_SIGNING_KEY: ${{ (secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.AUTO_UPDATE) != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Resolve the release tag FIRST so a malformed version fails in seconds,
      # not after the ~10-minute build. Trims all whitespace (the usual cause of
      # "tag_name is not well-formed" — a stray space from copy-paste) and
      # validates the shape (vX.Y.Z). Read via env to avoid shell injection.
      - name: Resolve release target
        id: rel
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ver="$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')"
          if [ -z "$ver" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No version entered — build only, no Release."
          elif printf '%s' "$ver" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$ver" >> "$GITHUB_OUTPUT"
            echo "Release tag: $ver"
          else
            echo "::error::Некорректная версия '$INPUT_VERSION'. Введите vX.Y.Z, например v1.0.2"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build static desktop shell
        run: npm run build:static

      - name: Desktop preflight
        run: npm run desktop:preflight

      - name: Build Tauri Windows bundle
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.AUTO_UPDATE }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            echo "Signing key present — building signed updater artifacts"
            npm run tauri:build -- --config src-tauri/tauri.updater.conf.json
          else
            echo "No signing key — building a plain installer (no auto-update artifacts)"
            npm run tauri:build
          fi

      # GATE: prove the just-built signature verifies against the public key baked
      # into the app (and into every already-installed client). If it doesn't,
      # those installs could not auto-update to this build — fail before publishing
      # so a broken update never reaches users (this is exactly what broke 1.0.2→1.0.3).
      - name: Verify updater signature against baked pubkey
        if: env.HAS_SIGNING_KEY == 'true'
        shell: bash
        run: |
          exe="$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)"
          node scripts/verify-updater-signature.mjs "$exe" "$exe.sig"

      # The NSIS installer is named from productName ("Финансовый помощник"), which
      # is Cyrillic. GitHub STRIPS non-ASCII characters from uploaded release asset
      # names, so the asset ends up as "_<ver>_x64-setup.exe" while latest.json
      # (built from the local name) points at the encoded Cyrillic name → 404 →
      # auto-update fails (exactly the 1.0.5 bug). Rename to a stable ASCII base so
      # the uploaded asset name and the manifest URL always match. The .sig signs
      # the file BYTES, not the name, so it stays valid after the rename.
      - name: Normalize installer filename to ASCII
        if: env.HAS_SIGNING_KEY == 'true'
        shell: bash
        run: |
          ver="${{ steps.rel.outputs.tag }}"; ver="${ver#v}"
          cd src-tauri/target/release/bundle/nsis
          exe="$(ls *-setup.exe | head -1)"
          newbase="financial-assistant_${ver}_x64-setup.exe"
          if [ "$exe" != "$newbase" ]; then
            mv -f "$exe" "$newbase"
            mv -f "$exe.sig" "$newbase.sig"
            echo "Renamed installer: '$exe' -> '$newbase'"
          fi
          ls -la

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: financial-assistant-windows
          path: |
            src-tauri/target/release/financial-assistant.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Generates the updater manifest (latest.json) from the signed .sig so the
      # in-app updater can find and verify the new version. Only when signing.
      - name: Generate updater manifest
        if: steps.rel.outputs.publish == 'true' && env.HAS_SIGNING_KEY == 'true'
        shell: bash
        run: node scripts/make-latest-json.mjs "${{ steps.rel.outputs.tag }}"

      # GATE: the manifest is what every installed client reads. One platform
      # entry missing `signature` makes the updater plugin reject the WHOLE file
      # — including the Windows entry — and every install reports "обновления
      # недоступны" (this is exactly what shipped in 1.6.0). Fail here, before
      # the release page ever sees it.
      - name: Verify updater manifest
        if: steps.rel.outputs.publish == 'true' && env.HAS_SIGNING_KEY == 'true'
        shell: bash
        run: node scripts/verify-latest-json.mjs src-tauri/target/release/bundle/nsis/latest.json "${{ steps.rel.outputs.tag }}"

      # Curated "what's new" for the Release page, pulled from the matching
      # CHANGELOG section (single source of truth). Falls back to an empty body —
      # so the release still publishes with just the auto-generated commit list —
      # if this version has no CHANGELOG entry yet.
      - name: Build release notes from CHANGELOG
        if: steps.rel.outputs.publish == 'true'
        shell: bash
        run: |
          if node scripts/changelog-extract.mjs "${{ steps.rel.outputs.tag }}" > RELEASE_NOTES.md; then
            echo "Using CHANGELOG section for ${{ steps.rel.outputs.tag }}."
          else
            echo "No CHANGELOG section for ${{ steps.rel.outputs.tag }} — auto-generated notes only."
            : > RELEASE_NOTES.md
          fi
          echo "----- release body -----"; cat RELEASE_NOTES.md

      # Publishes a GitHub Release with the installer attached so end users can
      # download it from the Releases page. action-gh-release creates the tag if
      # it does not exist yet. The .sig and latest.json are uploaded when signing
      # so /releases/latest/download/latest.json resolves for the updater. The
      # curated CHANGELOG body is prepended above the auto-generated commit list.
      - name: Publish GitHub Release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: Финансовый помощник ${{ steps.rel.outputs.tag }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json

  # ---------------------------------------------------------------------------
  # The phone build. It used to happen on the owner's own machine — Android
  # Studio, a keystore in a folder, `gh release upload` typed by hand — so a
  # release could only be cut from that one computer. Everything it needs is
  # here now: the keystore arrives as a secret, the APK is signed, its
  # certificate is checked against the one already on the phone, and only then
  # is it attached to the release the job above published.
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-windows
    timeout-minutes: 90

    permissions:
      contents: write

    env:
      # No keystore secret, no APK. An unsigned release APK will not install on
      # a phone, so building one would only produce something misleading.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # The certificate every installed copy was signed with. Android refuses to
      # update an app whose signature changed, so the wrong key here does not
      # mean "a bad build" — it means every phone has to uninstall and lose its
      # data. Checked before anything is published.
      EXPECTED_CERT_SHA256: 08521a60a60424a1cd8a0ad31cab8685951dea9438dfdbdd34714046e281230e
      TAG: ${{ needs.build-windows.outputs.tag }}
      PUBLISH: ${{ needs.build-windows.outputs.publish }}

    steps:
      - name: Say plainly that there is no keystore
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан — APK не собирается."
          echo "См. docs/ANDROID.md, раздел «Сборка в GitHub Actions»."

      - name: Checkout
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust with the Android targets
        if: env.HAS_KEYSTORE == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # A universal APK is four cross-compilations of the same Rust code. Cached,
      # a re-run costs minutes instead of the better part of an hour.
      - name: Cache Rust build
        if: env.HAS_KEYSTORE == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The runner already carries a JDK, an SDK and an NDK. Point the build at
      # them by the names scripts/tauri-android.mjs looks for — its own fallbacks
      # are Windows paths and find nothing here.
      - name: Point the build at the runner's toolchain
        if: env.HAS_KEYSTORE == 'true'
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$ndk" ]; then
            echo "::error::На раннере не нашлось NDK — без него Rust не собрать под Android."
            exit 1
          fi
          echo "JAVA_HOME=${JAVA_HOME_17_X64:-${JAVA_HOME:-}}" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install dependencies
        if: env.HAS_KEYSTORE == 'true'
        run: npm ci

      # The keystore never touches the repository: it is written to the runner's
      # temp folder, used, and goes away with the runner. keystore.properties is
      # git-ignored, so nothing here can be committed by accident.
      - name: Write the signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          store="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$store"
          if [ ! -s "$store" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 не разворачивается в файл — это должен быть base64 от .jks."
            exit 1
          fi
          cat > src-tauri/gen/android/keystore.properties <<PROPS
          storeFile=$store
          storePassword=$STORE_PASSWORD
          keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}
          keyAlias=${KEY_ALIAS:-financeapps}
          PROPS

      - name: Build the signed APK
        if: env.HAS_KEYSTORE == 'true'
        run: npm run android:build

      # GATE. The name is not cosmetic — latest.json points at exactly this file
      # name — and the certificate is what lets a new version install over the
      # old one. Both are settled before the upload, not after it.
      - name: Name the APK and check its signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          set -euo pipefail
          # On a dry run (workflow_dispatch with no version) there is no tag, and
          # the APK still deserves its real name — that is the run the owner uses
          # to prove the signing chain works before it is needed.
          ver="${TAG#v}"
          [ -n "$ver" ] || ver="$(node -p "require('./package.json').version")"
          src="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          out="financial-assistant_${ver}_universal.apk"
          mv "$src" "$out"

          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner не найден в $ANDROID_HOME/build-tools — проверить подпись нечем."
            exit 1
          fi
          echo "apksigner: $apksigner"

          # The whole of what the tool says, printed before anything is read out
          # of it. The first version of this step matched one exact line and got
          # an empty string, which is indistinguishable in the log from a wrong
          # key — the run said "подпись не та" while the real answer was "я не
          # понял ответа". stderr is captured too: "DOES NOT VERIFY" goes there.
          report="$("$apksigner" verify --print-certs "$out" 2>&1 || true)"
          echo "----- apksigner verify --print-certs -----"
          echo "$report"
          echo "------------------------------------------"

          # Take the digest by shape, not by the exact wording of the line around
          # it: 64 hex characters on the SHA-256 line of the first signer.
          got="$(printf '%s\n' "$report" \
            | grep -iE 'signer #1 .*sha-?256 digest' \
            | grep -oiE '[0-9a-f]{64}' \
            | head -1 \
            | tr 'A-F' 'a-f')"
          if [ -z "$got" ]; then
            echo "::error::Из вывода apksigner не удалось прочитать отпечаток — см. текст выше."
            exit 1
          fi
          echo "Отпечаток сертификата: $got"
          if [ "$got" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Подпись APK не совпадает с подписью установленных копий ($EXPECTED_CERT_SHA256)."
            echo "::error::Обновление поверх установленного приложения не встанет. Публикация отменена."
            exit 1
          fi
          echo "APK_NAME=$out" >> "$GITHUB_ENV"

      - name: Upload the APK artifact
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: financial-assistant-android
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Attach the APK to the release
        if: env.HAS_KEYSTORE == 'true' && env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$APK_NAME" --clobber

      # GATE. latest.json names the APK before it exists, so the only proof that
      # a phone will find it is asking for the published file the way the phone
      # asks. A 404 here is a release that quietly cannot update anyone — which
      # is what used to be checked by hand, and only when somebody remembered.
      - name: Check the published manifest the way a phone reads it
        if: env.HAS_KEYSTORE == 'true' && env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          node scripts/verify-latest-json.mjs "$base/latest.json" "$TAG"
          node scripts/verify-release-assets.mjs "$base/latest.json"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" src-tauri/gen/android/keystore.properties
