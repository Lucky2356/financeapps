# SonarCloud analysis configuration (read by Automatic Analysis).

sonar.projectKey=Lucky2356_financeapps
sonar.organization=lucky2356

# Two things are excluded from duplication detection only. Both are still fully
# analyzed for bugs, code smells and security — this narrows one metric, not the
# analysis.
#
# 1. The i18n catalog holds two parallel translation blocks — Russian and English
#    — with identical keys and structure. The detector reads them as ~98%
#    duplicated, which for a bilingual message catalog is the translation itself,
#    not copied logic.
#
# 2. Tests. A test states one fact per case: arrange the same way, act, assert.
#    That shape repeats by design, and the detector — which normalizes string and
#    number literals before comparing — sees a table of expected values as N
#    identical lines. Chasing it rewrites tests to please a metric instead of to
#    read well, and the tests get worse for it. This is the same call the project
#    already made about coverage below: tests are not product code, so they are
#    not where product-code metrics are measured.
sonar.cpd.exclusions=lib/i18n/catalog.ts,tests/**,e2e/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts

# Tests and generated Prisma client are not product code — keep them out of
# coverage accounting so the coverage metric reflects the app itself.
sonar.coverage.exclusions=tests/**,**/*.test.ts,**/*.test.tsx,lib/generated/**,scripts/**
